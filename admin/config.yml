backend:
  name: github
  repo: ashleykolodziej/ashleykolodziej
  branch: main # Branch to update (optional; defaults to master)
  site_domain: ashleykolodziej.com
local_backend: true
media_folder: static/img
public_folder: /img
collections:
  - name: 'posts'
    label: 'Posts'
    label_singular: 'Post'
    folder: 'content'
    create: true
    slug: '{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: true }
      - { label: 'Short Description', name: 'shortdesc', widget: 'string', required: false, allow_add: true }
      - { label: 'Category', name: 'categories', widget: 'list', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
    view_groups:
      - label: Year
        field: date
        # groups items based on the value matched by the pattern
        pattern: \d{4}
      - label: Drafts
        field: draft
