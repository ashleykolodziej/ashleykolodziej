<!DOCTYPE HTML>
<html data-color-mode="light" data-light-theme="light" data-dark-theme="dark" lang="en">
<head>
	<meta charset="utf-8">
	<!-- Required -->
	<style type="text/css">
		{{ partial "github.css" . | safeCSS }}
	</style>
	<meta name="viewport" content="width=device-width">
	<title>{{ .Title }} by ashleykolodziej · Pull Request #101 · bu-ist/r-questrom</title>
	<style type="text/css">
		.hide,
		.js-reviewed-toggle,
		.octicon-kebab-horizontal,
		.file-actions,
		.octicon-unfold,
		.octicon-copy {
			display: none;
		}

		.container-xl {
			top: 20px;
			position: relative;
		}
	</style>
 </head>

<body class="logged-in env-production page-responsive intent-mouse" style="word-wrap: break-word;">
<div class="position-relative js-header-wrapper ">

					<path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
				</svg>
			</a>
	    </div>
	    <h1 class="js-selected-navigation-item mt-md-n3 mb-md-n3 py-2 py-md-3 mr-0 mr-md-3 border-top border-md-top-0 border-white-fade" style="font-size: 14px; color: #fff;">{{ .Title }} Code Sample - Ashley Kolodziej</h1>
	</header>
</div>
<div class="container-xl">
	<div class="pr-toolbar js-sticky js-position-sticky d-flex is-stuck" data-original-top="0px" style="top: 0px !important; position: sticky;">
	   <div class="diffbar details-collapse js-details-container Details flex-1 d-flex flex-items-center width-full">
	      <div class="show-if-stuck mr-2 hide-md hide-sm">
	         <div id="pull-state" class="js-socket-channel js-updatable-content" data-channel="eyJjIjoiaXNzdWU6ODEyMjg4NTU0OnN0YXRlIiwidCI6MTYzNzU0MzU0Mn0=--4cc8533f0184c2630134dcb687768e2f201acaee6fb9d607ee6758a6758e9b22" data-url="/bu-ist/r-questrom/pull/101/partials/state" data-gid="MDExOlB1bGxSZXF1ZXN0NTc2Njc3ODk1">
	            <span title="Status: Merged" data-view-component="true" class="State State--merged">
	               <svg height="16" class="octicon octicon-git-merge" viewBox="0 0 16 16" version="1.1" width="16" aria-hidden="true">
	                  <path fill-rule="evenodd" d="M5 3.254V3.25v.005a.75.75 0 110-.005v.004zm.45 1.9a2.25 2.25 0 10-1.95.218v5.256a2.25 2.25 0 101.5 0V7.123A5.735 5.735 0 009.25 9h1.378a2.251 2.251 0 100-1.5H9.25a4.25 4.25 0 01-3.8-2.346zM12.75 9a.75.75 0 100-1.5.75.75 0 000 1.5zm-8.5 4.5a.75.75 0 100-1.5.75.75 0 000 1.5z"></path>
	               </svg>
	               Merged
	            </span>
	         </div>
	      </div>
	      <div class="flex-auto min-width-0">
	         <div class="show-if-stuck hide-md hide-sm">
	            <h1 class="d-flex text-bold f5">
	               <a class="js-issue-title css-truncate css-truncate-target Link--primary width-fit markdown-title">{{ .Title }}</a>
	               <span class="gh-header-number color-fg-muted pl-1">#101</span>
	            </h1>
	         </div>
	         <div class="d-flex flex-items-center">
	            <details class="details-reset details-overlay diffbar-item diffbar-range-menu select-menu hide-sm hide-md hide-lg js-diffbar-range-menu ml-0">
	               <summary data-hotkey="c" data-view-component="true" class="select-menu-button" aria-haspopup="menu" role="button">
	                  Changes from <strong>all commits</strong>
	               </summary>
	            </details>
	         </div>
	      </div>
	   </div>
	</div>
	{{ .Content }}
</div>
<script type="text/javascript">
	function toggleCode(e) {
		if (
				e.target.classList.contains('js-details-target') || 
				e.target.classList.contains('octicon')
			) {
			e.target.closest('.file-header').nextElementSibling.classList.toggle('hide');
		}
	}

	document.body.addEventListener("click", toggleCode);
</script>
{{ partial "end.html" . }}
